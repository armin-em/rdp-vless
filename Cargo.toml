[package]
name = "rdp-vless-tunnel"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.7"
rcgen = "0.13"
uuid = { version = "1.8", features = ["v4"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ring = "0.17"
rustls-pemfile = "2"
rand = "0.8"
hostname = "0.4.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.6"
